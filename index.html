<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111126">
  <meta name="description" content="A little hello, with a little extra sparkle.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111126;
      color: #f8f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, #5b3b9838 0, transparent 36%),
        radial-gradient(ellipse at 85% 78%, #e45f7b24 0, transparent 32%),
        #111126;
    }

    .glow {
      position: fixed;
      width: 25rem;
      height: 25rem;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .24;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow.one { top: -10rem; left: -7rem; background: #9f7aea; }
    .glow.two { right: -9rem; bottom: -13rem; background: #fb7185; animation-delay: -5s; }

    main {
      position: relative;
      width: min(90vw, 720px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 2rem;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      box-shadow: 0 30px 100px #0006, inset 0 1px #ffffff1c;
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      padding: .55rem .85rem;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      color: #d8ccff;
      background: #ffffff09;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .sparkle { color: #f9cc72; font-size: 1rem; }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7rem);
      line-height: .98;
      letter-spacing: -.075em;
    }

    h1 span {
      display: block;
      padding: .08em 0 .16em;
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 10%, #f0abfc 52%, #fda4af 92%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 27rem;
      margin: 1.5rem auto 0;
      color: #c5c2d8;
      font-size: clamp(1rem, 2.6vw, 1.15rem);
      line-height: 1.75;
    }

    .rule {
      width: 3rem;
      height: 3px;
      margin: 2rem auto 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #c4b5fd, #fda4af);
    }

    .footer {
      margin: 1.25rem 0 0;
      color: #8e8aa8;
      font-size: .8rem;
      letter-spacing: .04em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes drift {
      to { transform: translate(3rem, 2rem) scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <p class="eyebrow"><span class="sparkle" aria-hidden="true">✦</span> A fresh little start</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="message">A simple hello can be the beginning of something wonderful. Glad you’re here.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="footer">Made with a little extra sparkle ✨</p>
  </main>
</body>
</html>
